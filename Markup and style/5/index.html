<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Tornike Barbakadze"
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>სწავლის შედეგი 5 - Responsive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ჩვენი პროდუქცია (Responsive Grid)</h1>
        <p>შეამცირეთ ბრაუზერის ზომა ადაპტურობის შესამოწმებლად</p>
    </header>
    <main>
        <div class="products-grid">
            <div class="product-card">
                <div class="product-image">📦</div>
                <div class="product-info">
                    <h3>პროდუქტი 1</h3>
                    <p class="price">25.00 ₾</p>
                    <button class="buy-btn">ყიდვა</button>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image">📦</div>
                <div class="product-info">
                    <h3>პროდუქტი 2</h3>
                    <p class="price">42.00 ₾</p>
                    <button class="buy-btn">ყიდვა</button>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image">📦</div>
                <div class="product-info">
                    <h3>პროდუქტი 3</h3>
                    <p class="price">19.99 ₾</p>
                    <button class="buy-btn">ყიდვა</button>
                </div>
            </div>
            <div class="product-card">
                <div class="product-image">📦</div>
                <div class="product-info">
                    <h3>პროდუქტი 4</h3>
                    <p class="price">85.00 ₾</p>
                    <button class="buy-btn">ყიდვა</button>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
